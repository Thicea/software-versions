name: Publish site from versions.json

on:
  push:
    branches: [main]
    paths:
      - versions.json
      - templates/index.html
      - scripts/render.py
      - scripts/validate.py
      - scripts/check_update_scope.py
      - scripts/publish_pages.py
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Serialize publication with the weekday research workflow.
concurrency:
  group: refresh-software-versions
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test data rendering and update boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Generate page and product list from versions.json
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/render.py
      - name: Commit only generated files
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/check_update_scope.py --generated-only
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html products.json
          if ! git diff --cached --quiet; then
            git commit -m 'Render site and product names from versions.json'
            git push origin HEAD:main
          fi
      - name: Build Pages and verify the public HTML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/publish_pages.py --commit "$(git rev-parse HEAD)"
